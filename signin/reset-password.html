<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | P.R.O.T.E.C.T</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-page { min-height: 100svh; display: grid; place-items: center; padding: 30px 20px; background: #fdf7f3; }
        .reset-card { width: 100%; max-width: 500px; padding: 35px; background: white; border: 1px solid #e3dede; border-radius: 15px; }
        .reset-card .field { margin-bottom: 25px; }
        .reset-card .subtitle { margin-bottom: 30px; }
        .reset-card .help { margin-top: 25px; }
        button:disabled { opacity: .6; cursor: wait; }
    </style>
</head>
<body>
    <main class="reset-page">
        <section class="reset-card">
            <h1>Reset your password</h1>
            <p class="subtitle">Open the link from your reset email, then choose a new password.</p>
            <form id="reset-form">
                <div class="field">
                    <label for="new-password">New password</label>
                    <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirm new password</label>
                    <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
                </div>
                <button class="submit" id="reset-submit" disabled>Update password</button>
            </form>
            <p class="status" id="reset-status" role="status" aria-live="polite"></p>
            <p class="help"><a href="sign-in.html">Back to sign in</a></p>
        </section>
    </main>
    <script src="../auth/vendor/supabase-2.49.8.js"></script>
    <script src="../auth/config.js"></script>
    <script src="../auth/client.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
