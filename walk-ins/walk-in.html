<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Walk-ins | P.R.O.T.E.C.T
        </title>
        <link rel="stylesheet" href="style.css">
        <style>html.auth-pending body { visibility: hidden; }</style>
        <script>document.documentElement.classList.add('auth-pending');</script>
    </head>

    <body>
        <aside class="sidebar">
            <header class="brand">
                <a class="brand-link" href="../overview/overview.html" aria-label="P.R.O.T.E.C.T overview">
                    <img class="seal" src="../signin/logo.png" alt="">
                    <span>
                        P.R.O.T.E.C.T.
                    </span>
                </a>
                <p>
                    Probation Records Organization,
                    <br>
                    Tracking, Evidence, and
                    <br>
                    Compliance Tool
                </p>
            </header>

            <nav class="navigation" aria-label="Main navigation">
                <a class="nav-link" href="../overview/overview.html">
                    Overview
                </a>
                <a class="nav-link" href="../record/record.html">
                    Records
                </a>
                <a class="nav-link" href="../document/document.html">
                    Documents
                </a>
                <a class="nav-link active" href="walk-in.html" aria-current="page">
                    Walk-ins
                    <span class="active-dot" aria-hidden="true">
                    </span>
                </a>
                <a class="nav-link" href="../analytics/analytics.html">
                    Analytics
                </a>
                <a class="nav-link" href="../access-audit/access-audit.html">
                    Access &amp; audit
                </a>
            </nav>

            <footer class="sidebar-footer">
                <div class="officer">
                    <div class="avatar" aria-hidden="true">
                        --
                    </div>
                    <div>
                        <p class="officer-name">
                            Signed-in official
                        </p>
                        <p class="officer-role">
                            Account
                        </p>
                    </div>
                </div>
            </footer>

        </aside>

        <main class="records-page walk-ins-page">
            <header class="page-header">
                <div class="heading">
                    <h1>
                        Walk-ins
                    </h1>
                    <p>
                        View recorded walk-in visits.
                    </p>
                </div>
            </header>

            <section class="log-card" aria-labelledby="log-title">
                <header class="log-header">
                    <h2 id="log-title">
                        Walk-in log
                    </h2>
                    <p id="walk-in-count" aria-live="polite"></p>
                    <a href="../mobileapp/mobile.html">Mobile view</a>
                </header>

                <div id="walk-in-sync" role="status"></div>
                <div class="table-scroll" role="region" aria-labelledby="log-title" tabindex="0">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th scope="col">
                                    Name
                                </th>
                                <th scope="col">
                                    Time
                                </th>
                                <th scope="col">
                                    Date
                                </th>
                                <th scope="col">
                                    Purpose
                                </th>
                                <th scope="col">
                                    Remarks
                                </th>
                            </tr>
                        </thead>
                        <tbody id="walk-in-body">
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

        <dialog id="visit-dialog" aria-labelledby="visit-title">
            <h2 id="visit-title">
            </h2>
            <dl id="visit-details">
            </dl>
            <p class="dialog-note" id="visit-note">
            </p>
            <div class="dialog-actions">
                <a class="button secondary" id="case-link" href="../record/record.html">
                    Open case
                </a>
                <button class="button primary" id="close-visit" type="button">
                    Close
                </button>
            </div>
        </dialog>

        <script src="../record/data.js"></script>
        <script src="visits.js"></script>
        <script src="script.js">
        </script>
        <script src="../auth/vendor/supabase-2.49.8.js"></script>
        <script src="../auth/config.js"></script>
        <script src="../auth/client.js"></script>
        <script src="../auth/guard.js"></script>
    </body>

</html>
